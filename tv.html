<!DOCTYPE html>
<html lang="pt-BR" data-tv-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV — Painel de Senhas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800;9..144,900&family=JetBrains+Mono:wght@500;600&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var raw = localStorage.getItem('painel-senhas-lite');
        var theme = raw && JSON.parse(raw).settings.tvTheme;
        if (theme === 'dark' || theme === 'light') {
          document.documentElement.dataset.tvTheme = theme;
          document.addEventListener('DOMContentLoaded', function () {
            document.body.dataset.tvTheme = theme;
          });
        }
      } catch (e) {}
    </script>
  </head>
  <body data-tv-theme="light">
    <div id="root"></div>
    <script type="module" src="/src/tv/main.tsx"></script>
  </body>
</html>
